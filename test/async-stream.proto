syntax = "proto3";

package asynctest;

// Service used by the event-driven client streaming tests
service AsyncTestService {
    // Server streaming: sends three messages and closes
    rpc ServerStream (Req) returns (stream Resp);

    // Server streaming: sends messages slowly so a client cancel is observable
    rpc SlowStream (Req) returns (stream Resp);

    // Server streaming: fails with a non-OK gRPC status
    rpc FailingStream (Req) returns (stream Resp);

    // Bidirectional streaming: echoes every message received
    rpc BidiStream (stream Req) returns (stream Resp);

    // Bidirectional streaming: never answers and never closes its side
    rpc SilentBidi (stream Req) returns (stream Resp);

    // Client streaming: counts the messages received
    rpc ClientStream (stream Req) returns (Resp);
}

message Req {
    string name = 1;
    int32 id = 2;
}

message Resp {
    string message = 1;
    int32 status = 2;
}
